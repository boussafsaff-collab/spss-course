<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_blank">
<title>برمجيات إحصائية SPSS، د. بوصفصاف فريد، جامعة قسنطينة 2</title>
<meta name="description" content="مقياس برمجيات إحصائية SPSS: المحاضرات والتطبيقات وملفات البيانات، السنة الثانية ماستر إدارة مالية، جامعة قسنطينة 2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style id="spx-css">
html,body{margin:0;background:#e9eef5;}body{padding:clamp(6px,2vw,24px) clamp(4px,1.5vw,16px);}
#spx-root{font-family:'Cairo','Segoe UI','Noto Sans Arabic',Tahoma,sans-serif;max-width:960px;margin:0 auto;box-sizing:border-box;text-align:right;color:#1e293b;}
.qbtn{color:#fff !important;text-decoration:none !important;}
.spx-load{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;margin:0 0 16px;border-radius:18px;background:#fff;border:1px solid #e3e9f2;color:#475569;font-weight:700;font-size:15px;}
.spx-load i{color:#1d4ed8;}
.spx-fail{background:#fff;border:1px solid #e3e9f2;border-radius:18px;padding:clamp(16px,4vw,24px);margin:0 0 16px;text-align:center;line-height:1.8;}
.spx-fail h1{margin:0 0 4px;font-size:clamp(22px,6vw,30px);font-weight:800;color:#0f2744;}
.spx-fail p{margin:0 0 14px;color:#475569;font-size:14.5px;}
.spx-big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 16px;border-radius:16px;background:linear-gradient(145deg,#1d4f86,#0b1e33);color:#fff !important;text-decoration:none !important;font-weight:800;font-size:clamp(16px,4.4vw,19px);box-shadow:0 10px 24px rgba(11,30,51,.25);}
.spx-big i{font-size:22px;color:#e9c46a;}
.qbtn i{font-size:clamp(20px,6vw,26px);color:#fff;opacity:.95;}
.spx-share{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;margin:0 0 16px;padding:12px clamp(12px,3vw,18px);min-height:64px;border:1.5px solid #d4a73c;border-radius:16px;background:linear-gradient(135deg,#fffaf0,#fdf3dc);color:#5c400c;font:inherit;text-align:right;cursor:pointer;box-shadow:0 6px 16px rgba(180,134,42,.18);}
.spx-share:hover{filter:brightness(1.03);}
.spx-share-ico{flex:0 0 46px;width:46px;height:46px;border-radius:13px;background:#0f2744;color:#e9c46a;display:inline-flex;align-items:center;justify-content:center;font-size:22px;}
.spx-share-txt{flex:1 1 0;min-width:0;display:flex;flex-direction:column;line-height:1.5;}
.spx-share-txt strong{font-size:clamp(15.5px,4.2vw,18px);font-weight:800;color:#3f2a05;}
.spx-share-txt span{font-size:13px;color:#7a5410;font-weight:600;}
.spx-share-go{color:#b7862a;font-size:18px;}
.spx-modal{position:fixed;inset:0;z-index:2147483000;background:rgba(2,6,23,.62);display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;font-family:'Cairo','Segoe UI','Noto Sans Arabic',Tahoma,sans-serif;}
.spx-modal[hidden]{display:none;}
.spx-panel{background:#fff;color:#1e293b;border-radius:20px;width:100%;max-width:440px;max-height:calc(100vh - 20px);overflow:auto;padding:clamp(14px,4vw,22px);box-sizing:border-box;text-align:right;box-shadow:0 24px 60px rgba(2,6,23,.4);line-height:1.7;}
.spx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.spx-head h2{margin:0;font-size:clamp(17px,4.6vw,20px);font-weight:800;color:#0f2744;}
.spx-head h2 i{color:#b7862a;margin-left:8px;}
.spx-x{flex:0 0 40px;width:40px;height:40px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;color:#334155;font-size:18px;cursor:pointer;}
.spx-hint{margin:6px 0 10px;font-size:13.5px;color:#475569;}
.spx-qr{display:flex;justify-content:center;margin:14px 0 10px;}
.spx-qr canvas{width:min(78vw,300px);height:min(78vw,300px);image-rendering:pixelated;border-radius:12px;border:1px solid #e2e8f0;background:#fff;}
.spx-link input{width:100%;box-sizing:border-box;min-height:44px;border:1px solid #cbd5e1;border-radius:12px;padding:8px 12px;font:600 14px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#0f2744;background:#f8fafc;text-align:left;}
.spx-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.spx-btn{flex:1 1 120px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1.5px solid #0f2744;border-radius:12px;background:#fff;color:#0f2744;font:inherit;font-weight:800;font-size:15px;cursor:pointer;padding:6px 10px;}
.spx-btn.spx-primary{background:#0f2744;color:#fff;}
.spx-btn[hidden]{display:none;}
.spx-msg{min-height:1.6em;margin:8px 0 0;font-size:13.5px;font-weight:700;color:#047857;text-align:center;}
.spx-msg.err{color:#b45309;}
</style>
</head>
<body>
<div id="spx-root" dir="rtl" data-state="loading"><div class="spx-load" role="status"><i class="fa-solid fa-spinner fa-spin"></i><span>جارٍ تحميل صفحة المقياس…</span></div></div>
<button type="button" class="spx-share" id="spx-open" aria-haspopup="dialog"><span class="spx-share-ico"><i class="fa-solid fa-qrcode"></i></span><span class="spx-share-txt"><strong>شارك الحصة خارج المنصة</strong><span>رمز QR ورابط مباشر لزملائك الذين لا يملكون حساباً على المنصة</span></span><i class="fa-solid fa-share-nodes spx-share-go" aria-hidden="true"></i></button>
<div class="spx-modal" id="spx-modal" role="dialog" aria-modal="true" aria-labelledby="spx-title" hidden>
<div class="spx-panel" dir="rtl">
<div class="spx-head"><h2 id="spx-title"><i class="fa-solid fa-qrcode"></i>شارك الحصة خارج المنصة</h2><button type="button" class="spx-x" id="spx-close" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button></div>
<p class="spx-hint">اطلب من زميلك مسح الرمز بكاميرا هاتفه، أو أرسل له الرابط: يجد فيه المحاضرات والتطبيقات دون حساب على المنصة.</p>
<div class="spx-qr"><canvas id="spx-canvas" width="330" height="330" role="img" aria-label="رمز QR لصفحة المقياس"></canvas></div>
<div class="spx-link"><input id="spx-url" dir="ltr" readonly aria-label="الرابط"></div>
<div class="spx-actions">
<button type="button" class="spx-btn spx-primary" id="spx-copy"><i class="fa-solid fa-copy"></i><span>نسخ الرابط</span></button>
<button type="button" class="spx-btn" id="spx-share" hidden><i class="fa-solid fa-share-nodes"></i><span>مشاركة</span></button>
<button type="button" class="spx-btn" id="spx-dl"><i class="fa-solid fa-download"></i><span>تحميل الرمز</span></button>
</div>
<p class="spx-msg" id="spx-msg" aria-live="polite"></p>
</div></div>

<script>
(function(){
var qrcode=window.__spxQR;
var BASE='https://boussafsaff-collab.github.io/spss-course/';
var OPTS={home:{url:BASE,name:'صفحة المقياس'}};
var TITLE='برمجيات إحصائية SPSS، د. بوصفصاف فريد';
var cur='home',lastFocus=null;
function $(id){return document.getElementById(id);}
var modal=$('spx-modal'),cv=$('spx-canvas'),inp=$('spx-url'),msg=$('spx-msg');
function say(t,err){msg.textContent=t||'';msg.className='spx-msg'+(err?' err':'');}
function qrMatrix(text){var q=qrcode(0,'M');q.addData(text);q.make();return q;}
// يرسم الرمز مع هامش أبيض (4 وحدات) بدقة عالية
function drawQR(canvas,text,px,caption){
 var q=qrMatrix(text),n=q.getModuleCount(),quiet=4,cell=Math.max(4,Math.floor(px/(n+quiet*2)));
 var size=cell*(n+quiet*2),capH=caption?Math.round(cell*7):0;
 canvas.width=size;canvas.height=size+capH;
 var c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.fillStyle='#000';
 for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))c.fillRect((k+quiet)*cell,(r+quiet)*cell,cell,cell);
 if(caption){c.fillStyle='#0f2744';c.textAlign='center';c.textBaseline='middle';try{c.direction='rtl';}catch(e){}
  c.font='bold '+Math.round(cell*2.6)+'px Cairo, "Segoe UI", Tahoma, sans-serif';c.fillText(caption[0],size/2,size-cell*0.5);
  c.fillStyle='#475569';c.font=Math.round(cell*1.9)+'px Consolas, monospace';try{c.direction='ltr';}catch(e){}var fs=Math.round(cell*1.9);while(fs>10&&c.measureText(caption[1]).width>size*0.94){fs--;c.font=fs+'px Consolas, monospace';}c.fillText(caption[1],size/2,size+cell*3);}
}
function select(){cur='home';inp.value=OPTS[cur].url;drawQR(cv,OPTS[cur].url,660);cv.setAttribute('data-url',OPTS[cur].url);say('');}
function open(){lastFocus=document.activeElement;modal.hidden=false;select(cur);
 // داخل إطار Moodle (iframe) طويل: تمرير الصفحة الأم حتى تظهر النافذة
 // (العنصر الثابت fixed يتمركز وسط الإطار كله، فقد يقع خارج الشاشة؛ نضعه قرب زر المشاركة ثم نمرّر إليه)
 var inFrame=true;try{inFrame=window.self!==window.top;}catch(e){}
 if(inFrame){var de=document.documentElement,btn=$('spx-open');
  modal.style.position='absolute';modal.style.top='0';modal.style.left='0';modal.style.right='0';modal.style.bottom='auto';
  modal.style.height=Math.max(de.scrollHeight,document.body.scrollHeight)+'px';modal.style.alignItems='flex-start';
  modal.style.paddingTop=Math.max(10,btn.getBoundingClientRect().top+(window.pageYOffset||de.scrollTop)-40)+'px';
  modal.querySelector('.spx-panel').style.maxHeight='none';
  try{modal.querySelector('.spx-panel').scrollIntoView({block:'start'});}catch(e){}}
 try{$('spx-close').focus({preventScroll:true});}catch(e){$('spx-close').focus();}}
function close(){modal.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);return ok;}
function copy(){var t=OPTS[cur].url;
 var done=function(){say('تم نسخ الرابط ✓');},manual=function(){inp.focus();inp.select();say('حدِّد الرابط أعلاه وانسخه يدوياً.',true);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,function(){fallbackCopy(t)?done():manual();});}
 else{fallbackCopy(t)?done():manual();}}
function share(){var o=OPTS[cur];
 navigator.share({title:TITLE,text:o.name+': '+TITLE,url:o.url}).then(function(){say('');},function(e){if(!e||e.name!=='AbortError')copy();});}
function download(){var o=OPTS[cur],c=document.createElement('canvas');drawQR(c,o.url,1000,['برمجيات إحصائية SPSS',o.url.replace('https://','')]);
 var name='spss-qr-landing.png';
 try{c.toBlob(function(b){if(!b){window.open(c.toDataURL('image/png'),'_blank');return;}
  var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u);},4000);say('تم تحميل الرمز ✓');},'image/png');}
 catch(e){say('تعذّر التحميل؛ يمكنك أخذ لقطة شاشة للرمز.',true);}}
$('spx-open').addEventListener('click',open);
$('spx-close').addEventListener('click',close);
modal.addEventListener('click',function(e){if(e.target===modal)close();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)close();});
$('spx-copy').addEventListener('click',copy);
$('spx-dl').addEventListener('click',download);
if(navigator.share){$('spx-share').hidden=false;$('spx-share').addEventListener('click',share);}
inp.addEventListener('focus',function(){inp.select();});
})();
</script>
<script>
/* غلاف Moodle الدائم: كل المحتوى يُجلب عند الفتح من صفحة المقياس على GitHub (index.html + أنماطها + assets/programme.js)،
   فأي تعديل في المستودع يظهر هنا دون إعادة رفع هذا الملف. يبقى هنا فقط زر المشاركة ونافذة رمز QR. */
(function(){
var SITE='https://boussafsaff-collab.github.io/spss-course/';
var root=document.getElementById('spx-root'),share=document.getElementById('spx-open'),mycss=document.getElementById('spx-css');
function abs(u){try{return new URL(u,SITE+'index.html').href;}catch(e){return u;}}
function bust(u){return u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now();}
function fail(){if(root.getAttribute('data-state')==='ok')return;root.setAttribute('data-state','fail');root.textContent='';
 var box=document.createElement('div');box.className='spx-fail';
 box.innerHTML='<h1>برمجيات إحصائية <bdi dir="ltr">SPSS</bdi></h1><p>تعذّر تحميل محتوى صفحة المقياس الآن. افتحها مباشرة من الزر أدناه، أو أعد تحميل الصفحة بعد قليل.</p>'
  +'<a class="spx-big" href="'+SITE+'" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i><span>فتح صفحة المقياس</span></a>';
 root.appendChild(box);root.appendChild(share);}
function inject(html){
 var doc=new DOMParser().parseFromString(html,'text/html');
 var main=doc.body&&doc.body.querySelector('nav.qnav');if(!main)throw new Error('unexpected page');
 // الأنماط: من رأس صفحة GitHub، قبل أنماط الغلاف
 Array.prototype.forEach.call(doc.head.querySelectorAll('link[rel~="stylesheet"],style'),function(n){
  if(n.tagName==='LINK'){var h=abs(n.getAttribute('href'));if(document.head.querySelector('link[href="'+h+'"]'))return;var l=document.createElement('link');l.rel='stylesheet';l.href=h;document.head.insertBefore(l,mycss);}
  else{var st=document.createElement('style');st.textContent=n.textContent;document.head.insertBefore(st,mycss);}});
 // السكربتات الخارجية فقط (assets/programme.js…)
 var srcs=[];Array.prototype.forEach.call(doc.body.querySelectorAll('script'),function(sc){var u=sc.getAttribute('src');if(u)srcs.push(abs(u));sc.parentNode.removeChild(sc);});
 // روابط مطلقة إلى GitHub، في لسان جديد
 Array.prototype.forEach.call(doc.body.querySelectorAll('[href],[src]'),function(el){
  ['href','src'].forEach(function(k){var v=el.getAttribute(k);if(v&&!/^(mailto:|tel:|data:|javascript:)/i.test(v))el.setAttribute(k,abs(v));});
  if(el.tagName==='A'&&/^https?:/i.test(el.getAttribute('href')||'')){el.setAttribute('target','_blank');el.setAttribute('rel','noopener');}});
 var frag=document.createDocumentFragment();while(doc.body.firstChild)frag.appendChild(document.adoptNode(doc.body.firstChild));
 root.textContent='';root.appendChild(frag);
 var nav=root.querySelector('nav.qnav');nav.parentNode.insertBefore(share,nav.nextSibling);
 root.setAttribute('data-state','ok');
 srcs.forEach(function(u){var s=document.createElement('script');s.src=bust(u);document.body.appendChild(s);});}
var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort();fail();},12000);
try{fetch(bust(SITE+'index.html'),{cache:'no-store',signal:ctl?ctl.signal:undefined})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
 .then(function(t){clearTimeout(to);if(root.getAttribute('data-state')==='fail')return;inject(t);})
 .catch(function(){clearTimeout(to);fail();});}catch(e){fail();}
})();
</script>
</body>
