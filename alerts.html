<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="assets/auth.js?v=697" data-page="alerts"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2744">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بوصلة التعليم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التنبيهات، بوصلة التعليم</title>
<meta name="description" content="تنبيهاتك في بوصلة التعليم: تنبيهات الأستاذ، التقييمات المفتوحة، الحضور، وطلبات المراجعة.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background:#eef2f7}
body{margin:0;font-family:Cairo,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;color:#0f172a;background:#eef2f7;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:14px 12px 28px}
h1{font-size:22px;margin:6px 4px 10px;color:#0f2744;display:flex;align-items:center;gap:8px}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.tb .sm{flex:1 1 100%;margin:0 4px;font-size:14px;color:#475569}
.b2{font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:6px 14px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;color:#0f2744;cursor:pointer}
.b2:hover{background:#f1f5f9}
ul.al{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.al li{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(15,39,68,.05)}
ul.al li.un{background:#eff6ff;border-color:#93c5fd;box-shadow:inset -4px 0 0 #2563eb,0 2px 10px rgba(37,99,235,.10)}
ul.al li.un.urg{background:#fff7ed;border-color:#fb923c;box-shadow:inset -4px 0 0 #ea580c,0 2px 10px rgba(234,88,12,.12)}
ul.al .hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
ul.al .hd .ic{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:18px}
ul.al .hd b{font-size:15.5px;color:#0f2744}
ul.al li.urg .hd b{color:#9a3412}
ul.al .nw{font-size:11.5px;font-weight:800;color:#fff;background:#2563eb;border-radius:999px;padding:0 8px;line-height:20px}
ul.al li.urg .nw{background:#ea580c}
ul.al time{margin-inline-start:auto;font-size:12.5px;color:#64748b;direction:ltr;unicode-bidi:isolate}
ul.al p{margin:6px 0 8px;font-size:14.5px;overflow-wrap:anywhere}
ul.al .ac{display:flex;flex-wrap:wrap;gap:8px}
ul.al .go{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:6px 16px;border-radius:12px;background:#0f2744;color:#fff;font-weight:800;font-size:14.5px;text-decoration:none;flex:1 1 180px}
ul.al li.urg .go{background:#ea580c}
.emp{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:22px 16px;text-align:center;color:#334155}
.emp small{color:#64748b}
a:focus-visible,button:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
body footer#spss-copy{margin:10px auto 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px;color:#64748b}
body footer#spss-copy a{color:inherit}
</style>
</head>
<body>
<main id="main">
<h1><span aria-hidden="true">🔔</span> التنبيهات</h1>
<div id="spss-alp" aria-live="polite"><p class="emp">جارٍ تحميل التنبيهات…</p></div>
</main>
</body>
</html>
